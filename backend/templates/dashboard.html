{% extends "base.html" %}
{% block title %}选品看板 - 带货运营系统{% endblock %}

{% block content %}
<!-- 全局数字卡 -->
<div class="stat-row" id="stat-row">
  <div class="stat-card"><div class="label">商品总数</div><div class="value" id="s-total">-</div></div>
  <div class="stat-card"><div class="label">已入选商品</div><div class="value blue" id="s-selected">-</div></div>
  <div class="stat-card"><div class="label">已生成脚本</div><div class="value" id="s-scripts">-</div></div>
  <div class="stat-card"><div class="label">已审核脚本</div><div class="value green" id="s-approved">-</div></div>
  <div class="stat-card"><div class="label">累计佣金</div><div class="value red" id="s-commission">-</div></div>
</div>

<!-- 今日重点类目 -->
<div class="card">
  <div class="card-title">🏷️ 今日重点类目 <span class="sub" id="cat-date"></span></div>
  <div class="cat-grid" id="cat-grid">
    <div class="loading">正在加载类目数据...</div>
  </div>
</div>

<!-- 今日 Top10 候选商品 -->
<div class="card">
  <div class="card-title">📦 今日 Top10 候选商品
    <span class="sub" id="product-date"></span>
    <span style="flex:1"></span>
    <input type="date" id="date-picker" style="margin-left:auto; padding:4px 10px; border:1px solid #ddd; border-radius:6px;">
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>商品</th>
          <th>类目</th>
          <th>综合评分</th>
          <th>佣金</th>
          <th>30天销量</th>
          <th>状态</th>
          <th>链接</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="products-tbody">
        <tr><td colspan="9" class="loading">正在加载商品数据...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 评分卡浮层 -->
<div class="card" id="scorecard-panel" style="display:none;">
  <div class="card-title">🎯 评分卡详情
    <button class="btn btn-default btn-sm" onclick="document.getElementById('scorecard-panel').style.display='none'">关闭</button>
  </div>
  <div id="scorecard-content"><div class="loading">加载中...</div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const datePicker = document.getElementById('date-picker');
datePicker.value = TODAY;

async function loadOverview() {
  const d = await apiFetch('/api/v1/stats/overview');
  if (!d) return;
  document.getElementById('s-total').textContent    = d.products.total;
  document.getElementById('s-selected').textContent = d.products.selected;
  document.getElementById('s-scripts').textContent  = d.scripts.total;
  document.getElementById('s-approved').textContent = d.scripts.approved;
  document.getElementById('s-commission').textContent = '¥' + (d.commission.total || 0).toFixed(0);
}

async function loadCategories(date) {
  const d = await apiFetch(`/api/v1/category/today?date=${date}`);
  const grid = document.getElementById('cat-grid');
  document.getElementById('cat-date').textContent = d?.date || '';
  if (!d || !d.categories.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🏷️</div><div class="msg">暂无类目数据，请先运行 category_radar 录入</div></div>';
    return;
  }
  grid.innerHTML = d.categories.map(c => `
    <div class="cat-card">
      <div class="cat-name">${c.category_l1}</div>
      <div class="cat-sub">${c.category_l2} · ${c.keyword}</div>
      <div class="cat-score">${c.heat_score?.toFixed(0) || '-'}</div>
      <div class="cat-trend">${trendTag(c.trend_7d)}</div>
    </div>
  `).join('');
}

async function loadProducts(date) {
  const d = await apiFetch(`/api/v1/products/top10?date=${date}`);
  const tbody = document.getElementById('products-tbody');
  document.getElementById('product-date').textContent = d?.date || '';
  if (!d || !d.products.length) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="icon">📦</div><div class="msg">暂无商品数据，请先运行选品脚本</div></div></td></tr>';
    return;
  }
  tbody.innerHTML = d.products.map((p, i) => {
    const rankClass = i < 3 ? 'top3' : '';
    const score = p.total_score ? p.total_score.toFixed(1) : '-';
    const scoreWidth = p.total_score ? Math.min(p.total_score, 100) : 0;
    const img = p.cover_img ? `<img class="product-thumb" src="${p.cover_img}" onerror="this.style.display='none'">` : '<div class="product-thumb" style="background:#eee;display:flex;align-items:center;justify-content:center;font-size:18px;">📦</div>';
    return `
      <tr>
        <td class="rank ${rankClass}">${i+1}</td>
        <td>
          <div class="product-info">
            ${img}
            <div>
              <div class="name"><a href="${p.pdd_url || '#'}" target="_blank">${p.title || '未命名'}</a></div>
              <div class="meta">¥${p.price || '-'} · ${p.review_count || 0}评</div>
            </div>
          </div>
        </td>
        <td>${p.category_l1 || ''} <span style="color:#ccc">/</span> ${p.category_l2 || ''}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-weight:700;color:${scoreColor(p.total_score)}">${score}</span>
            <div class="progress-bar" style="width:60px"><div class="progress-fill" style="width:${scoreWidth}%;background:${scoreColor(p.total_score)}"></div></div>
          </div>
        </td>
        <td><b style="color:#FF4D4F">¥${p.commission_amt?.toFixed(1) || '-'}</b><div style="font-size:11px;color:#999">${p.commission_rate || 0}%</div></td>
        <td>${p.sales_30d?.toLocaleString() || '-'}</td>
        <td>${statusTag(p.status)}</td>
        <td>${p.pdd_url ? `<a href="${p.pdd_url}" target="_blank" class="btn btn-default btn-sm">🔗 链接</a>` : '-'}</td>
        <td>
          <button class="btn btn-default btn-sm" onclick="showScorecard(${p.id})">📊 评分卡</button>
          ${p.status !== 'selected' ? `<button class="btn btn-primary btn-sm" style="margin-left:4px" onclick="selectProduct(${p.id})">✅ 选中</button>` : ''}
        </td>
      </tr>
    `;
  }).join('');
}

async function showScorecard(productId) {
  const panel = document.getElementById('scorecard-panel');
  const content = document.getElementById('scorecard-content');
  panel.style.display = 'block';
  content.innerHTML = '<div class="loading">加载评分卡...</div>';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const d = await apiFetch(`/api/v1/products/${productId}/scorecard`);
  if (!d || !d.product) { content.innerHTML = '<div class="empty-state"><div class="icon">❌</div><div class="msg">加载失败</div></div>'; return; }

  const p = d.product;
  const dims = d.dimensions || [];

  content.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px">
      <div>
        <b style="font-size:15px">${p.title}</b>
        <div style="margin-top:8px;font-size:13px;color:#666">
          <div>类目：${p.category_l1 || '-'} / ${p.category_l2 || '-'}</div>
          <div>价格：¥${p.price || '-'}（原价 ¥${p.origin_price || '-'}）</div>
          <div>佣金：¥${p.commission_amt || '-'}（${p.commission_rate || 0}%）</div>
          <div>30天销量：${(p.sales_30d || 0).toLocaleString()} · 评分 ${p.rating || '-'}</div>
        </div>
      </div>
      <div style="text-align:center">
        <div style="font-size:48px;font-weight:800;color:${scoreColor(d.score?.total_score)}">
          ${d.score?.total_score?.toFixed(1) || '-'}
        </div>
        <div style="font-size:12px;color:#999">综合评分 / 100</div>
        <div style="margin-top:8px">${statusTag(p.status)}</div>
      </div>
    </div>
    <div class="score-bar-list">
      ${dims.map(dim => `
        <div class="score-bar-item">
          <div class="dim-label">${dim.label}</div>
          <div class="bar"><div class="fill" style="width:${(dim.value||0)*10}%;background:${scoreColor((dim.value||0)*10)}"></div></div>
          <div class="score-val">${(dim.value||0).toFixed(1)}</div>
        </div>
      `).join('')}
    </div>
    ${p.notes ? `<div style="margin-top:12px;padding:10px;background:#FFF7E6;border-radius:6px;font-size:13px">📝 备注：${p.notes}</div>` : ''}
  `;
}

async function selectProduct(productId) {
  await apiPatch(`/api/v1/products/${productId}/status`, {status: 'selected'});
  loadProducts(datePicker.value);
}

function refresh() {
  const date = datePicker.value;
  loadCategories(date);
  loadProducts(date);
}

datePicker.addEventListener('change', refresh);

// 初始化
loadOverview();
refresh();
</script>
{% endblock %}
